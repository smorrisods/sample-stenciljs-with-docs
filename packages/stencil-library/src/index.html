<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Stencil Component Starter</title>

    <script type="module" src="/build/stencil-library.esm.js"></script>
    <script nomodule src="/build/stencil-library.js"></script>
  </head>
  <body>
    <my-component first="Click" middle="Me to" last="Count"></my-component>
    <my-input id="input-1" label="Error Test"></my-input>

    <script>
      window.onload = () => {
        const input1 = document.getElementById('input-1');
        input1.inputValidator = async value => {
          if (value === 'error') return "You entered 'error'";
        };
      };
    </script>
  </body>
</html>
